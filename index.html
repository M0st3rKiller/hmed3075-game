<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DreamStation · HMED 3075</title>
<link rel="stylesheet" href="assets/app.css?v=1794974155">
</head>
<body>
<main class="entry">
  <form class="entry-card" id="f" novalidate>
    <p class="muted" style="font-weight:600;margin:0">HMED 3075 discussion</p>
    <h1>DreamStation</h1>
    <p>A role-play on medical device regulation.</p>
    <label for="n">Your table number</label>
    <div class="entry-row">
      <input id="n" inputmode="numeric" autocomplete="off" maxlength="2" autofocus aria-describedby="err">
      <button class="btn primary" type="submit">Enter</button>
    </div>
    <div class="err" id="err" role="status"></div>
  </form>
</main>
<script>
  document.getElementById("f").addEventListener("submit", e => {
    e.preventDefault();
    const v = document.getElementById("n").value.trim();
    if (/^[1-6]$/.test(v)) location.href = "table.html?t=" + v;
    else document.getElementById("err").textContent = "Enter a table number from 1 to 6.";
  });
</script>
</body>
</html>
