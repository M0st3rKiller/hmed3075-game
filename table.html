<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your table · DreamStation</title>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/content.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  const { G, store, esc, table, item } = DS;
  const n = new URLSearchParams(location.search).get("t");
  const T = table(n);
  const app = document.getElementById("app");
  if (!T) {
    app.innerHTML = `<main class="wrap"><h1>Table not found</h1><p>Go back to the <a href="index.html">entry page</a> and type a table number from 1 to 6.</p></main>`;
    return;
  }
  document.title = `Table ${T.n}: ${T.name} · DreamStation`;
  document.documentElement.style.setProperty("--role", T.color);

  const KEY = "ds-table-v2-" + T.n;
  const ORDER = ["role", "act1", "act2", "debrief"];
  const st = store.get(KEY, { at: "role" });
  if (!ORDER.includes(st.at)) st.at = "role";

  function srcList(keys) {
    if (!keys.length) return "";
    return `<div class="sources"><b>Sources</b><ol>${keys.map(k => `<li><a href="${esc(G.sources[k].u)}" target="_blank" rel="noopener">${esc(G.sources[k].t)}</a></li>`).join("")}</ol></div>`;
  }
  function numberer() {
    const order = [];
    const fn = k => { if (!order.includes(k)) order.push(k); return order.indexOf(k) + 1; };
    fn.order = order;
    return fn;
  }
  function unlockBox(label) {
    return `<form class="unlock-end" id="uf">
      <label for="code"><b>${esc(label)}</b><span class="muted small"> Type the unlock word from the big screen and press Enter.</span></label>
      <div class="unlock"><input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn primary" type="submit">Unlock</button></div>
      <div class="err" id="uerr" role="status"></div>
    </form>`;
  }

  function rolePanel() {
    return `<h2>Your role</h2>
      <p style="font-size:1.1rem">${esc(T.intro)}</p>
      <div class="card3">
        <section><h4>What you want</h4><p style="margin:0">${esc(T.interest)}</p></section>
        <section><h4>Your dilemma</h4><p style="margin:0">${esc(T.dilemma)}</p></section>
      </div>
      <div class="boxed"><p class="bh">Before we start</p><p style="margin:0">${esc(G.warmup.statement)}</p></div>
      <h3>How to play</h3>
      <ul>${G.warmup.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
      <p class="small muted"><span class="tag H">Historical</span> comes from the public record, with a numbered source link. <span class="tag F">Fictional</span> was written for this game.</p>
      ${unlockBox("Act I: Launch")}`;
  }

  function actPanel(act) {
    const num = numberer();
    const c = act.cards[T.n];
    const list = arr => `<ul>${arr.map(x => `<li>${item(x, num)}${x.go ? ` <span class="go">Go to Table ${x.go}: ${esc(table(x.go).name)}</span>` : ""}</li>`).join("")}</ul>`;
    let h = `<h2>Act ${act.n === 1 ? "I" : "II"}: ${esc(act.title)}</h2>`;
    h += act.shared.map((s, i) => `<div class="reading"><h3>${i + 1}. ${esc(s.h)}</h3>${s.p.map(x => `<p class="${x.strong ? "strong" : ""}">${item(x, num)}</p>`).join("")}</div>`).join("");
    h += `<div class="boxed"><p class="bh">Only your table has this</p>
      <div class="card3" style="border-top:0;margin-top:0">
        <section><h4>What you know</h4>${list(c.know)}</section>
        <section><h4>Why you might hold back</h4>${list(c.concerns)}</section>
        <section style="border-bottom:0"><h4>What you need, and who has it</h4>${list(c.need)}</section>
      </div></div>`;
    h += `<h3>Primary source</h3><p>${item(c.source, num)}</p>`;
    h += `<div class="question"><b>Your question</b>${esc(c.question)}</div>`;
    h += `<h3>Your choice (your spokesperson tells the TA)</h3><ul class="options">${c.options.map(o => `<li>${esc(o)}</li>`).join("")}</ul>`;
    h += srcList(num.order);
    h += act.key === "act1" ? unlockBox("Act II: Fallout") : `<div class="unlock-end"><button class="btn primary" data-go="debrief">Go to the debrief</button></div>`;
    return h;
  }

  function debriefPanel() {
    return `<h2>Debrief: what really happened</h2>
      <ul class="timeline">${G.debrief.map(d => `<li><b>${esc(d.y)}</b><span>${esc(d.t)}</span></li>`).join("")}</ul>`;
  }

  function render() {
    const i = ORDER.indexOf(st.at);
    const body = st.at === "role" ? rolePanel() : st.at === "debrief" ? debriefPanel() : actPanel(G.acts.find(a => a.key === st.at));
    const back = i > 0 ? `<button class="backlink" data-go="${ORDER[i - 1]}">Back to ${st.at === "act1" ? "your role" : st.at === "act2" ? "Act I" : "Act II"}</button>` : "";
    app.innerHTML = `<header class="band"><div class="in"><span class="num">${T.n}</span><h1>${esc(T.name)}</h1><span class="lbl">${esc(T.label)}</span></div></header>
      <main class="wrap">${back}<section class="panel solo">${body}</section></main>`;

    app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { st.at = b.dataset.go; store.set(KEY, st); render(); window.scrollTo(0, 0); });
    const f = document.getElementById("uf");
    if (f) {
      const next = st.at === "role" ? "act1" : "act2";
      f.onsubmit = e => {
        e.preventDefault();
        if (document.getElementById("code").value.trim().toUpperCase() === G.unlock[next]) {
          st.at = next; store.set(KEY, st); render(); window.scrollTo(0, 0);
        } else {
          document.getElementById("uerr").textContent = "That word does not open the next act. Check the big screen and try again.";
        }
      };
    }
  }
  render();
})();
</script>
</body>
</html>
