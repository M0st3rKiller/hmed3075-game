<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your table · DreamStation</title>
<link rel="stylesheet" href="assets/app.css?v=1794975568">
<script src="assets/content.js?v=1794975568"></script>
<script src="assets/app.js?v=1794975568"></script>
</head>
<body class="tpage">
<div id="app"></div>
<script>
(function () {
  const { G, store, esc, table, item } = DS;
  const n = new URLSearchParams(location.search).get("t");
  const T = table(n);
  const app = document.getElementById("app");
  if (!T) {
    app.innerHTML = `<main class="wrap"><h1>Table not found</h1><p>Go back to the <a href="index.html">entry page</a> and type a table number from 1 to 6.</p></main>`;
    return;
  }
  document.title = `Table ${T.n}: ${T.name} · DreamStation`;
  document.documentElement.style.setProperty("--role", T.color);

  const KEY = "ds-table-v5-" + T.n;
  const ORDER = ["role", "game", "end"];
  const st = store.get(KEY, { at: "role" });
  if (!ORDER.includes(st.at)) st.at = "role";

  function srcList(keys) {
    if (!keys.length) return "";
    return `<p class="sources inline"><b>Sources</b> ${keys.map((k, i) => `[${i + 1}] <a href="${esc(G.sources[k].u)}" target="_blank" rel="noopener">${esc(G.sources[k].t)}</a>`).join(" &nbsp; ")}</p>`;
  }
  function numberer() {
    const order = [];
    const fn = k => { if (!order.includes(k)) order.push(k); return order.indexOf(k) + 1; };
    fn.order = order;
    return fn;
  }
  function unlockBox(label) {
    return `<form class="unlock-end" id="uf">
      <label for="code"><b>${esc(label)}</b><span class="muted small"> Type the unlock word from the big screen and press Enter.</span></label>
      <div class="unlock"><input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn primary" type="submit">Unlock</button></div>
      <div class="err" id="uerr" role="status"></div>
    </form>`;
  }

  function rolePanel() {
    return `<div class="grid2">
      <div>
        <h2>Your role</h2>
        <p class="intro">${esc(T.intro)}</p>
        <div class="card3">
          <section><h4>What you want</h4><p>${esc(T.interest)}</p></section>
          <section><h4>Your dilemma</h4><p>${esc(T.dilemma)}</p></section>
        </div>
        <div class="boxed"><p class="bh">Before we start</p><p style="margin:0">${esc(G.warmup.statement)}</p></div>
      </div>
      <div>
        <h2>How to play</h2>
        <ul class="rules">${G.warmup.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
        <p class="small muted"><span class="tag H">Historical</span> comes from the public record, with a numbered source link. <span class="tag F">Fictional</span> was written for this game.</p>
        ${unlockBox("Start the game")}
      </div>
    </div>`;
  }

  function actPanel(act) {
    const num = numberer();
    const c = act.cards[T.n];
    const facts = `<ul class="guide">${c.facts.map(x => `<li>${item(x, num)}${x.means ? `<span class="means"><b>What this means for you:</b> ${esc(x.means)}</span>` : ""}</li>`).join("")}</ul>`;
    const hide = `<ul class="guide">${c.hide.map(x => `<li>${item(x, num)}<span class="means"><b>Why:</b> ${esc(x.why)}</span></li>`).join("")}</ul>`;
    const ul = arr => `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    const story = act.shared.map((sec, i) => `<h3>${i + 1}. ${esc(sec.h)}</h3>${sec.p.map(x => `<p class="${x.strong ? "strong" : ""}">${item(x, num)}</p>`).join("")}`).join("");
    const card = `<div class="boxed tight guidebox"><p class="bh">Your decision guide</p>
        <div class="guidegrid">
          <div><h4>Your part in this</h4><p class="weigh">${item(c.past, num)}</p>
            <h4>Key facts</h4>${facts}
            <h4>What you might want to keep quiet</h4>${hide}</div>
          <div><h4>The pull on you</h4>
            <p class="sub up">Reasons to act</p>${ul(c.pulls.act)}
            <p class="sub down">Reasons to hold back</p>${ul(c.pulls.hold)}
            <h4>The blame game</h4>
            <p class="sub">Who will blame you</p>${ul(c.blame.you)}
            <p class="sub">Who you can blame</p>${ul(c.blame.them)}</div>
        </div>
      </div>`;
    const film = `<div class="filmbox"><p class="bh">In The Bleeding Edge</p><ul>${c.films.map(x => `<li>${item(x, num)}</li>`).join("")}</ul></div>`;
    const next = `<div class="unlock-end"><button class="btn primary" data-go="end">Finish the game</button></div>`;
    return `<h2 class="acttitle">${esc(act.title)}</h2>
      <div class="actgrid">
        <div class="story2 reading">${story}</div>
        <aside class="cardcol">${film}</aside>
      </div>
      ${card}
      <div class="bottomrow">
        <div>
          <p class="optlabel">Two recommendations (your spokesperson tells your boss, the TA)</p>
          <div class="question"><b>Question 1: The black specks</b>${esc(c.question)}</div>
          <ul class="options">${c.options.map(o => `<li>${esc(o)}</li>`).join("")}</ul>
          <div class="question q2"><b>Question 2: ${esc(c.q2.topic)}</b>${item(c.q2.ctx, num)} ${esc(c.q2.question)}</div>
          <ul class="options">${c.q2.options.map(o => `<li>${esc(o)}</li>`).join("")}</ul>
        </div>
        <div>${next}</div>
      </div>
      ${srcList(num.order)}`;
  }

  function endPanel() {
    return `<div class="endscreen">
      <p class="kicker">End of the game</p>
      <p class="endbig">Your recommendations are in. The machines are being recalled.</p>
      <p class="endbig">Now look up at the big screen to see what really happened.</p>
    </div>`;
  }

  function render() {
    const i = ORDER.indexOf(st.at);
    const body = st.at === "role" ? rolePanel() : st.at === "end" ? endPanel() : actPanel(G.acts.find(a => a.key === st.at));
    const back = i > 0 ? `<button class="backlink" data-go="${ORDER[i - 1]}">Back to ${st.at === "game" ? "your role" : "the game"}</button>` : "";
    app.innerHTML = `<header class="band"><div class="in"><span class="num">${T.n}</span><h1>${esc(T.name)}</h1><span class="lbl">${esc(T.label)}</span></div></header>
      <main class="tp">${back}<section class="tp-panel">${body}</section></main>`;

    app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { st.at = b.dataset.go; store.set(KEY, st); render(); window.scrollTo(0, 0); });
    const f = document.getElementById("uf");
    if (f) {
      const next = "game";
      f.onsubmit = e => {
        e.preventDefault();
        if (document.getElementById("code").value.trim().toUpperCase() === G.unlock[next]) {
          st.at = next; store.set(KEY, st); render(); window.scrollTo(0, 0);
        } else {
          document.getElementById("uerr").textContent = "That word does not open the game. Check the big screen and try again.";
        }
      };
    }
  }
  render();
})();
</script>
</body>
</html>
