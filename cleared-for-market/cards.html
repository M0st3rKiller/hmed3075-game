<!DOCTYPE html>
<html lang="en">
<head>
<title>Table cards · Cleared for Market</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/data.js"></script>
<script src="assets/qrcode.js"></script>
<script src="assets/app.js"></script>
<style>
  .sheet { max-width: 900px; margin: 0 auto; padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .card { background: #fff; border: 4px solid var(--ink); padding: 16px; display: grid; grid-template-columns: 1fr 150px; gap: 14px; align-items: center; }
  .card h2 { font-size: 1.4rem; margin: 0 0 4px; }
  .card .bar { height: 8px; margin-bottom: 10px; }
  .card svg { width: 150px; height: 150px; }
  .card .url { font-size: .72rem; color: var(--steel); word-break: break-all; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="sheet">
  <div class="noprint" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px">
    <p style="margin:0">Print this page and put one card on each table.</p>
    <button class="btn primary" onclick="print()">Print cards</button>
  </div>
  <div class="grid" id="g"></div>
</div>
<script>
  const { G, esc, roleURL, qrSVG } = CFM;
  document.getElementById("g").innerHTML = G.roles.map(r => `<div class="card">
    <div><div class="bar" style="background:${r.color}"></div>
      <p class="muted" style="margin:0;font-weight:600">${esc(r.label)}</p>
      <h2>${esc(r.name)}</h2>
      <p class="small" style="margin:0 0 6px">Scan to open your role page.</p>
      <div class="url">${esc(roleURL(r))}</div></div>
    ${qrSVG(roleURL(r))}</div>`).join("");
</script>
</body>
</html>
