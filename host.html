<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host · DreamStation</title>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/content.js"></script>
<script src="assets/app.js"></script>
</head>
<body class="host">
<header class="hbar">
  <h1>DreamStation</h1>
  <nav class="htabs" id="htabs" aria-label="Class sections"></nav>
</header>
<main class="hmain" id="main"></main>
<script>
(function () {
  const { G, store, esc } = DS;
  const KEY = "ds-host-v2";
  const TABS = [
    { id: "video", name: "Promo video", stages: [{ name: "Video", minutes: 5 }] },
    { id: "warmup", name: "Warm-up", stages: [{ name: "Recap", minutes: 7 }, { name: "Read your role", minutes: 3 }] },
    { id: "act1", name: "Act I: Launch", stages: G.stages },
    { id: "act2", name: "Act II: Fallout", stages: G.stages },
    { id: "debrief", name: "Debrief", stages: null }
  ];
  const fresh = () => ({ tab: 0, stage: { video: 0, warmup: 0, act1: 0, act2: 0 }, shown: {}, choices: { act1: {}, act2: {} }, timer: { left: 300, endAt: null } });
  let S = store.get(KEY, null) || fresh();
  const save = () => store.set(KEY, S);
  const main = document.getElementById("main");

  const tab = () => TABS[S.tab];
  const stageList = () => tab().stages;
  const stageIdx = () => S.stage[tab().id] || 0;
  const stageMin = () => stageList() ? stageList()[stageIdx()].minutes : 0;

  /* ---------- Timer ---------- */
  const left = () => S.timer.endAt ? Math.round((S.timer.endAt - Date.now()) / 1000) : S.timer.left;
  const fmt = s => (s < 0 ? "+" : "") + Math.floor(Math.abs(s) / 60) + ":" + String(Math.abs(s) % 60).padStart(2, "0");
  function toggleTimer() {
    if (!stageList()) return;
    if (S.timer.endAt) { S.timer.left = left(); S.timer.endAt = null; } else { S.timer.endAt = Date.now() + S.timer.left * 1000; }
    save(); render();
  }
  function resetTimer() { S.timer = { left: stageMin() * 60, endAt: null }; save(); render(); }
  setInterval(() => {
    const el = document.getElementById("clock");
    if (!el) return;
    const t = left();
    el.textContent = fmt(t);
    el.parentElement.classList.toggle("over", t < 0);
  }, 250);

  function goTab(i) {
    if (i < 0 || i >= TABS.length) return;
    S.tab = i;
    S.timer = { left: stageMin() * 60, endAt: null };
    save(); render(); window.scrollTo(0, 0);
  }
  function goStage(i) {
    const L = stageList();
    if (!L || i < 0 || i >= L.length) return;
    S.stage[tab().id] = i;
    S.timer = { left: L[i].minutes * 60, endAt: null };
    save(); render();
  }

  /* ---------- Pieces ---------- */
  function stagesBar() {
    const L = stageList(); if (!L || L.length < 2) return "";
    const k = stageIdx();
    return `<div class="stages">${L.map((s, i) => `<button class="stage ${i < k ? "done" : ""} ${i === k ? "now" : ""}" data-stage="${i}">${esc(s.name)}<small>${s.minutes} min</small></button>`).join("")}</div>`;
  }
  function timerBox() {
    const t = left();
    return `<div class="timer ${t < 0 ? "over" : ""}"><div class="lbl">${S.timer.endAt ? "Time left" : "Paused"}</div><div class="t" id="clock">${fmt(t)}</div></div>`;
  }
  function controls(extra) {
    const L = stageList();
    return `<div class="controls">
      ${L ? `<button class="btn primary" data-a="timer">${S.timer.endAt ? "Pause timer" : "Start timer"}</button><button class="btn" data-a="reset">Reset timer</button>` : ""}
      ${L && L.length > 1 ? `<button class="btn" data-a="nextstage" ${stageIdx() === L.length - 1 ? "disabled" : ""}>Next stage</button>` : ""}
      ${extra || ""}
      <button class="btn" data-a="prev" ${S.tab === 0 ? "disabled" : ""}>Previous section</button>
      <button class="btn" data-a="next" ${S.tab === TABS.length - 1 ? "disabled" : ""}>Next section</button>
    </div>
    <p class="small muted keys">Keys: 1 to 5 jump to a section. Left and right arrows change section. Space starts or pauses the timer. N moves to the next stage.${S.stage[tab().id] !== undefined && tab().id.startsWith("act") ? " R shows or hides the unlock word." : ""}</p>`;
  }

  /* ---------- Views ---------- */
  function videoView() {
    main.className = "hmain single";
    return `<div class="kicker">Before we start</div>
      <div class="video" style="margin-top:10px"><iframe src="https://www.youtube-nocookie.com/embed/${esc(G.video.id)}?rel=0" title="${esc(G.video.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
      <p class="small muted" style="margin-top:8px">${esc(G.video.title)}</p>
      <div class="row">${timerBox()}</div>${controls()}`;
  }

  function warmupView() {
    main.className = "hmain";
    const k = stageIdx();
    const leftCol = k === 0
      ? `<div class="kicker">Warm-up</div><h2 class="big">Recap: The Bleeding Edge</h2>
         <p class="lead">Start from your worksheet. Talk with your table.</p>
         ${stagesBar()}
         <ol class="qs">${G.warmup.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ol>
         <div class="row" style="margin-top:18px">${timerBox()}</div>${controls()}`
      : `<div class="kicker">Warm-up</div><h2 class="big">Read your role</h2>
         <p class="lead">Open the entry page on your laptop, type your table number, and read the "Your role" tab.</p>
         ${stagesBar()}
         <div class="boxed"><p class="bh">Before we start</p><p style="margin:0;font-size:1.2rem">${esc(G.warmup.statement)}</p></div>
         <div class="row" style="margin-top:18px">${timerBox()}</div>${controls()}`;
    const rightCol = `<h2>Tables</h2>
      <ul class="tables-list">${G.tables.map(t => `<li><b>${t.n}</b>${esc(t.name)} <span class="muted small">${esc(t.label)}</span></li>`).join("")}</ul>
      <h2 style="margin-top:20px">How we play</h2>
      <ul>${G.warmup.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul>`;
    return [leftCol, rightCol];
  }

  function actView() {
    const a = G.acts.find(x => x.key === tab().id);
    const shown = !!S.shown[a.key];
    const ch = S.choices[a.key];
    main.className = "hmain";
    const story = a.shared.map((s, i) => `<div class="story"><h3>${i + 1}. ${esc(s.h)}</h3>${s.p.map(x => `<p class="${x.strong ? "strong" : ""}">${esc(x.t)}</p>`).join("")}</div>`).join("");
    const leftCol = `<div class="kicker">Act ${a.n === 1 ? "I" : "II"}</div><h2 class="big">${esc(a.title)}</h2>
      ${stagesBar()}
      <div class="row">
        <div class="codebox ${shown ? "" : "hidden"}" data-a="reveal" title="Click to show or hide"><div class="lbl">Unlock word</div><div class="word" aria-hidden="${!shown}">${shown ? esc(G.unlock[a.key]) : "XXXXX"}</div></div>
        ${timerBox()}
      </div>
      ${controls(`<button class="btn" data-a="reveal">${shown ? "Hide unlock word" : "Show unlock word"}</button>`)}
      <div class="storybox">${story}</div>`;
    const done = G.tables.every(t => ch[t.n] !== undefined);
    const rightCol = `<h2>Each table's choice</h2>
      ${G.tables.map(t => `<div class="choice"><div class="who"><span class="sw" style="background:${t.color}"></span>${t.n}. ${esc(t.name)}</div>
        <div class="chips">${a.cards[t.n].options.map((o, i) => `<button class="chip" aria-pressed="${ch[t.n] === i}" data-t="${t.n}" data-o="${i}">${esc(o)}</button>`).join("")}</div>
        ${ch[t.n] !== undefined ? `<p class="result">${esc(a.outcome.lines[t.n][ch[t.n]])}</p>` : ""}</div>`).join("")}
      ${done ? `<div class="boxed alarm outcome"><p class="bh">What happens next</p><p>${esc(a.outcome.lead)}</p><p><b>${esc(a.outcome.rule)}</b></p>${a.outcome.close ? `<p>${esc(a.outcome.close)}</p>` : ""}</div>`
             : `<p class="small muted" style="margin-top:12px">Click the option each spokesperson announces. The outcome appears when all six tables have chosen.</p>`}`;
    return [leftCol, rightCol];
  }

  function debriefView() {
    main.className = "hmain single";
    return `<div class="kicker">Debrief</div><h2 class="big">What really happened</h2>
      <ul class="timeline" style="margin-top:12px">${G.debrief.map(d => `<li><b>${esc(d.y)}</b><span>${esc(d.t)}</span></li>`).join("")}</ul>
      ${controls(`<button class="btn" data-a="clear">Clear all records</button>`)}`;
  }

  function render() {
    document.getElementById("htabs").innerHTML = TABS.map((t, i) => `<button class="htab ${i < S.tab ? "done" : ""} ${i === S.tab ? "now" : ""}" data-tab="${i}" ${i === S.tab ? 'aria-current="step"' : ""}>${i + 1}. ${esc(t.name)}</button>`).join("");
    const id = tab().id;
    const v = id === "video" ? videoView() : id === "warmup" ? warmupView() : id === "debrief" ? debriefView() : actView();
    main.innerHTML = Array.isArray(v) ? `<section>${v[0]}</section><aside class="side">${v[1]}</aside>` : `<section>${v}</section>`;
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-tab],[data-a],[data-stage],[data-t]");
    if (!b) return;
    if (b.dataset.tab !== undefined) return goTab(+b.dataset.tab);
    if (b.dataset.stage !== undefined) return goStage(+b.dataset.stage);
    if (b.dataset.t !== undefined) {
      const k = tab().id, t = b.dataset.t, o = +b.dataset.o;
      if (S.choices[k][t] === o) delete S.choices[k][t]; else S.choices[k][t] = o;
      save(); return render();
    }
    const a = b.dataset.a, id = tab().id;
    if (a === "timer") toggleTimer();
    if (a === "reset") resetTimer();
    if (a === "prev") goTab(S.tab - 1);
    if (a === "next") goTab(S.tab + 1);
    if (a === "nextstage") goStage(stageIdx() + 1);
    if (a === "reveal") { S.shown[id] = !S.shown[id]; save(); render(); }
    if (a === "clear" && window.confirm("Clear all recorded choices and start a new class?")) { S = fresh(); save(); render(); }
  });
  document.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input,textarea")) return;
    const id = tab().id;
    if (e.key >= "1" && e.key <= "5") goTab(+e.key - 1);
    else if (e.key === "ArrowRight") goTab(S.tab + 1);
    else if (e.key === "ArrowLeft") goTab(S.tab - 1);
    else if (e.key === " ") { e.preventDefault(); toggleTimer(); }
    else if (e.key === "n" || e.key === "N") goStage(stageIdx() + 1);
    else if ((e.key === "r" || e.key === "R") && id.startsWith("act")) { S.shown[id] = !S.shown[id]; save(); render(); }
  });

  render();
})();
</script>
</body>
</html>
