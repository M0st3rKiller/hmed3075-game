<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host · DreamStation</title>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/content.js"></script>
<script src="assets/app.js"></script>
</head>
<body class="host">
<header class="hbar">
  <h1>DreamStation</h1>
  <nav class="htabs" id="htabs" aria-label="Class sections"></nav>
</header>
<main class="hmain" id="main"></main>
<script>
(function () {
  const { G, store, esc, table, item } = DS;
  const KEY = "ds-host-v1";
  const TABS = [
    { id: "video", name: "Promo video", minutes: 5 },
    { id: "warmup", name: "Warm-up", minutes: 10 },
    { id: "act1", name: "Act I: Launch" },
    { id: "act2", name: "Act II: Fallout" },
    { id: "debrief", name: "Debrief", minutes: 5 }
  ];
  const fresh = () => ({ tab: 0, stage: { act1: 0, act2: 0 }, shown: {}, choices: { act1: {}, act2: {} }, project: false, reveal: 0, timer: { left: 300, endAt: null } });
  let S = store.get(KEY, null) || fresh();
  const save = () => store.set(KEY, S);
  const main = document.getElementById("main");

  const curTab = () => TABS[S.tab];
  const act = () => G.acts.find(a => a.key === curTab().id);
  function stageMinutes() {
    const t = curTab();
    if (t.minutes) return t.minutes;
    return G.stages[S.stage[t.id]].minutes;
  }

  /* ---------- Timer ---------- */
  const left = () => S.timer.endAt ? Math.round((S.timer.endAt - Date.now()) / 1000) : S.timer.left;
  const fmt = s => (s < 0 ? "+" : "") + Math.floor(Math.abs(s) / 60) + ":" + String(Math.abs(s) % 60).padStart(2, "0");
  function toggleTimer() {
    if (S.timer.endAt) { S.timer.left = left(); S.timer.endAt = null; } else { S.timer.endAt = Date.now() + S.timer.left * 1000; }
    save(); render();
  }
  function resetTimer() { S.timer = { left: stageMinutes() * 60, endAt: null }; save(); render(); }
  setInterval(() => {
    const el = document.getElementById("clock");
    if (!el) return;
    const t = left();
    el.textContent = fmt(t);
    el.parentElement.classList.toggle("over", t < 0);
  }, 250);

  function goTab(i) {
    if (i < 0 || i >= TABS.length) return;
    S.tab = i; S.project = false;
    S.timer = { left: stageMinutes() * 60, endAt: null };
    save(); render();
  }
  function goStage(i) {
    const id = curTab().id;
    if (!S.stage.hasOwnProperty(id) || i < 0 || i >= G.stages.length) return;
    S.stage[id] = i;
    S.timer = { left: G.stages[i].minutes * 60, endAt: null };
    save(); render();
  }

  /* ---------- Pieces ---------- */
  function timerBox() {
    const t = left();
    return `<div class="timer ${t < 0 ? "over" : ""}"><div class="lbl">${S.timer.endAt ? "Time left" : "Paused"}</div><div class="t" id="clock">${fmt(t)}</div></div>`;
  }
  function controls(extra) {
    return `<div class="controls">
      <button class="btn primary" data-a="timer">${S.timer.endAt ? "Pause timer" : "Start timer"}</button>
      <button class="btn" data-a="reset">Reset timer</button>
      ${extra || ""}
      <button class="btn" data-a="prev" ${S.tab === 0 ? "disabled" : ""}>Previous section</button>
      <button class="btn" data-a="next" ${S.tab === TABS.length - 1 ? "disabled" : ""}>Next section</button>
    </div>`;
  }
  const keys = t => `<p class="small muted keys">Keys: 1 to 5 jump to a section. Left and right arrows change section. Space starts or pauses the timer.${t ? " " + t : ""}</p>`;

  function wrapText(a) {
    const ch = S.choices[a.key];
    const lines = G.tables.map(t => ch[t.n] !== undefined ? a.wrap.lines[t.n][ch[t.n]] : null).filter(Boolean);
    return `<div class="wraptext"><p>${esc(a.wrap.lead)}</p>${lines.map(l => `<p>${esc(l)}</p>`).join("")}<p class="rule">${esc(a.wrap.rule)}</p>${a.wrap.close ? `<p>${esc(a.wrap.close)}</p>` : ""}</div>`;
  }

  /* ---------- Tabs ---------- */
  function videoView() {
    main.className = "hmain single";
    return `<div class="kicker">Before we start</div>
      <div class="video" style="margin-top:10px"><iframe src="https://www.youtube-nocookie.com/embed/${esc(G.video.id)}?rel=0" title="${esc(G.video.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
      <p class="small muted" style="margin-top:8px">${esc(G.video.title)}</p>
      <div class="row">${timerBox()}</div>
      ${controls()}${keys()}`;
  }

  function warmupView() {
    main.className = "hmain";
    return [`<div class="kicker">Warm-up</div>
      <h2 class="big">Recap: The Bleeding Edge</h2>
      <p class="lead">Start from your worksheet. Talk with your table.</p>
      <ol class="qs">${G.warmup.questions.map(q => `<li>${esc(q)}</li>`).join("")}</ol>
      <div class="row" style="margin-top:18px">${timerBox()}</div>
      ${controls()}${keys()}`,
    `<h2>How we play</h2>
      <ul>${G.warmup.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
      <div class="boxed"><p class="bh">Before we start</p><p style="margin:0">${esc(G.warmup.statement)}</p></div>
      <h2>Tables</h2>
      <ul class="tables-list">${G.tables.map(t => `<li><b>${t.n}</b>${esc(t.name)} <span class="muted small">${esc(t.label)}</span></li>`).join("")}</ul>
      <p class="small muted">Students open the entry page and type their table number.</p>`];
  }

  function actView() {
    const a = act();
    const sIdx = S.stage[a.key];
    const shown = !!S.shown[a.key];
    main.className = "hmain";
    const stagesBar = `<div class="stages">${G.stages.map((s, i) => `<button class="stage ${i < sIdx ? "done" : ""} ${i === sIdx ? "now" : ""}" data-stage="${i}">${esc(s.name)}<small>${s.minutes} min</small></button>`).join("")}</div>`;
    let leftCol;
    if (S.project) {
      leftCol = `<div class="kicker">Act ${a.n === 1 ? "I" : "II"}: ${esc(a.title)}</div><h2 class="big">Wrap-up</h2><div class="projected">${wrapText(a)}</div>
        <div class="row" style="margin-top:12px">${timerBox()}</div>${controls(`<button class="btn" data-a="project">Hide wrap-up</button>`)}${keys("P shows or hides the wrap-up. N moves to the next stage.")}`;
    } else {
      leftCol = `<div class="kicker">Act ${a.n === 1 ? "I" : "II"}</div><h2 class="big">${esc(a.title)}</h2>
        <p class="lead">${a.shared.map(s => esc(s.h)).join(". ")}.</p>
        ${stagesBar}
        <div class="row">
          <div class="codebox ${shown ? "" : "hidden"}" data-a="reveal" title="Click to show or hide"><div class="lbl">Unlock word</div><div class="word" aria-hidden="${!shown}">${shown ? esc(G.unlock[a.key]) : "XXXXXX"}</div></div>
          ${timerBox()}
        </div>
        ${controls(`<button class="btn" data-a="reveal">${shown ? "Hide unlock word" : "Show unlock word"}</button><button class="btn" data-a="nextstage" ${sIdx === G.stages.length - 1 ? "disabled" : ""}>Next stage</button>`)}
        ${keys("N moves to the next stage. R shows the unlock word. P shows the wrap-up.")}`;
    }
    const ch = S.choices[a.key];
    const rightCol = `<h2>Table choices</h2>
      ${G.tables.map(t => `<div class="choice"><div class="who"><span class="sw" style="background:${t.color}"></span>${t.n}. ${esc(t.name)}</div>
        <div class="chips">${a.cards[t.n].options.map((o, i) => `<button class="chip" aria-pressed="${ch[t.n] === i}" data-t="${t.n}" data-o="${i}" title="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`).join("")}
      <div class="notes"><div class="bh">TA wrap-up (only you see this until you project it)</div>${wrapText(a)}
        <button class="btn" data-a="project" style="margin-top:6px">${S.project ? "Hide wrap-up" : "Show wrap-up on screen"}</button></div>`;
    return [leftCol, rightCol];
  }

  function debriefView() {
    main.className = "hmain single";
    const items = G.debrief.slice(0, S.reveal);
    const done = S.reveal >= G.debrief.length;
    return `<div class="kicker">Debrief: what really happened</div>
      <ul class="timeline">${items.map(d => `<li><b>${esc(d.y)}</b><span>${esc(d.t)}</span></li>`).join("")}</ul>
      ${done ? `<img class="thumb" src="https://img.youtube.com/vi/${esc(G.video.id)}/hqdefault.jpg" alt="Still from the Philips DreamStation promotional video"><p class="final">${esc(G.finalQuestion)}</p>` : ""}
      <div class="row" style="margin-top:16px">${timerBox()}</div>
      ${controls(`<button class="btn" data-a="revealnext" ${done ? "disabled" : ""}>Reveal next</button><button class="btn" data-a="revealreset">Start over</button><button class="btn" data-a="clear">Clear all records</button>`)}
      ${keys("N reveals the next item.")}`;
  }

  function render() {
    document.getElementById("htabs").innerHTML = TABS.map((t, i) => `<button class="htab ${i < S.tab ? "done" : ""} ${i === S.tab ? "now" : ""}" data-tab="${i}" ${i === S.tab ? 'aria-current="step"' : ""}>${i + 1}. ${esc(t.name)}</button>`).join("");
    const id = curTab().id;
    const v = id === "video" ? videoView() : id === "warmup" ? warmupView() : id === "debrief" ? debriefView() : actView();
    main.innerHTML = Array.isArray(v) ? `<section>${v[0]}</section><aside class="side">${v[1]}</aside>` : `<section>${v}</section>`;
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-tab],[data-a],[data-stage],[data-t]");
    if (!b) return;
    if (b.dataset.tab !== undefined) return goTab(+b.dataset.tab);
    if (b.dataset.stage !== undefined) return goStage(+b.dataset.stage);
    if (b.dataset.t !== undefined) {
      const k = curTab().id, t = b.dataset.t, o = +b.dataset.o;
      if (S.choices[k][t] === o) delete S.choices[k][t]; else S.choices[k][t] = o;
      save(); return render();
    }
    const a = b.dataset.a, id = curTab().id;
    if (a === "timer") toggleTimer();
    if (a === "reset") resetTimer();
    if (a === "prev") goTab(S.tab - 1);
    if (a === "next") goTab(S.tab + 1);
    if (a === "reveal") { S.shown[id] = !S.shown[id]; save(); render(); }
    if (a === "nextstage") goStage(S.stage[id] + 1);
    if (a === "project") { S.project = !S.project; save(); render(); }
    if (a === "revealnext") { S.reveal = Math.min(G.debrief.length, S.reveal + 1); save(); render(); }
    if (a === "revealreset") { S.reveal = 0; save(); render(); }
    if (a === "clear" && window.confirm("Clear all recorded choices and start a new class?")) { S = fresh(); save(); render(); }
  });
  document.addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input,textarea")) return;
    const id = curTab().id;
    if (e.key >= "1" && e.key <= "5") goTab(+e.key - 1);
    else if (e.key === "ArrowRight") goTab(S.tab + 1);
    else if (e.key === "ArrowLeft") goTab(S.tab - 1);
    else if (e.key === " ") { e.preventDefault(); toggleTimer(); }
    else if (e.key === "n" || e.key === "N") { if (id === "debrief") { S.reveal = Math.min(G.debrief.length, S.reveal + 1); save(); render(); } else if (S.stage[id] !== undefined) goStage(S.stage[id] + 1); }
    else if ((e.key === "r" || e.key === "R") && S.stage[id] !== undefined) { S.shown[id] = !S.shown[id]; save(); render(); }
    else if ((e.key === "p" || e.key === "P") && S.stage[id] !== undefined) { S.project = !S.project; save(); render(); }
  });

  if (!S.timer || S.timer.left === undefined) S.timer = { left: stageMinutes() * 60, endAt: null };
  render();
})();
</script>
</body>
</html>
